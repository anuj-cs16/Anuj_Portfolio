<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#050814"/>
  <rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <text x="50%" y="62%" font-family="'Poppins', sans-serif" font-weight="800" font-size="44" fill="url(#neonGrad)" text-anchor="middle" filter="url(#glow)">AD</text>
</svg>
